name: trazabilidad

# Prueba el verificador de la matriz en cada cambio.
#
# NO verifica el plan de ejemplo-registraduria: esta incompleto a proposito y
# completarlo es el ejercicio. En el repositorio del proyecto, agregue un paso
# con `mvn -B verify -Dplan=../plan` para que la matriz del equipo se
# verifique en cada pull request.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificador:
    name: Pruebas del verificador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: mvn -B verify
        working-directory: trazabilidad
